# Trot on Render: one Node web service (API, public dog pages and the built app)
# plus a Postgres database. DATABASE_URL comes straight from the database, so the
# password never has to be copied by hand.
services:
  - type: web
    name: trot-app
    runtime: node
    plan: starter
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAPBOX
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trot-db
          property: connectionString

databases:
  - name: trot-db
    plan: basic-256mb
    region: virginia
    databaseName: trot_db
    user: trot_db_user
    postgresMajorVersion: "16"
