# Trot on Render: one Node web service (API, public dog pages and the built app)
# plus a Postgres database. This replaces the earlier static site.
services:
  - type: web
    name: trot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: trot-db
          property: connectionString

databases:
  - name: trot-db
    plan: free
